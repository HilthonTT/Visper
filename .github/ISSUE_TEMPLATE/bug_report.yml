name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [api, api-sdk, cli, proxy, ai, web, docker / infra]
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `visper` ...
        2. Create a room ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Remove any secrets, room codes or message contents.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: input
    id: env
    attributes:
      label: OS and terminal
      placeholder: e.g. Windows 11 + Windows Terminal, macOS 15 + kitty
