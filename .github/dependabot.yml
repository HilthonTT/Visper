version: 2

updates:
  - package-ecosystem: gomod
    directories: ["/services/api", "/services/proxy", "/clients/cli", "/sdk/go"]
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /services/ai
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /clients/web
    schedule:
      interval: weekly
    groups:
      web-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: ["/services/api", "/services/proxy", "/services/ai"]
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
