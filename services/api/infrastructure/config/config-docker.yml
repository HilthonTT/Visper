server:
  internalPort: "5005"
  externalPort: "5005"
  runMode: "release"
  domain: "localhost"
  frontEndUrl: "http://localhost:3000"

logger:
  filePath: "/app/logs/"
  encoding: "json"
  level: "info"
  logger: "zap"

cors:
  allowOrigins: "*"

# Secrets below are development defaults matching docker-compose.yml.
# Override them with VISPER_POSTGRES_PASSWORD / VISPER_REDIS_PASSWORD etc.
postgres:
  host: "postgres" # Use service name from docker-compose
  port: "5432"
  user: "postgres"
  password: "admin"
  dbName: "visper_db"
  sslMode: "disable"
  maxIdleConns: 15
  maxOpenConns: 100
  connMaxLifetime: 5s

redis:
  host: "redis" # Use service name from docker-compose
  port: "6379"
  password: "password"
  db: "0"
  dialTimeout: 5s
  readTimeout: 5s
  writeTimeout: 5s
  poolSize: 10
  poolTimeout: 15s
  idleCheckFrequency: 500ms

jaeger:
  serviceName: "visper-api"
  serviceVersion: "v1.0.0"
  endpoint: "http://jaeger:4318" # OTLP/HTTP receiver of the jaeger service (legacy :14268/api/traces URLs are mapped automatically)

sentry:
  dsn: "" # set VISPER_SENTRY_DSN to enable
  debug: false
  sendDefaultPII: false
