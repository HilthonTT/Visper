version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - unconvert
  settings:
    gosec:
      excludes:
        - G104 # duplicated by errcheck
        - G115 # integer overflow conversions: too noisy for this codebase
        - G304 # file paths come from the user / config by design (CLI, proxy config)
        - G404 # math/rand is fine for load-balancing choices; crypto uses crypto/rand
        - G706 # log "injection" of our own config values
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, bodyclose]
      # Vendored Stainless-style SDK internals
      - path: api-sdk/internal/
        linters: [gosec, errorlint]

formatters:
  enable:
    - gofmt
    - goimports
